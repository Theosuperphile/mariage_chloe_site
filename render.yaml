services:
  - type: web
    name: mariage-chloe
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /sante
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: FLASK_ENV
        value: production
      - key: APP_BASE_URL
        value: https://mariage-chloe.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mariage-chloe-db
          property: connectionString

databases:
  - name: mariage-chloe-db
    plan: free
    databaseName: mariage_chloe
    user: mariage_chloe
